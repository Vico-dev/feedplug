name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (syntax + tests + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-marketing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-marketing/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prisma generate + syntax check + tests
        run: npm run ci

      - name: Dependency audit (gate on high+)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Dependency audit (gate on high+)
        run: npm audit --omit=dev --audit-level=high
