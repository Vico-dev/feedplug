substitutions:
  _GIT_SHA: 'unknown'   # passé par deploy-backend-marketing.sh : git rev-parse --short HEAD

steps:
  # Build l'image Docker avec le Dockerfile du backend-marketing.
  # Taguée par le SHA git (traçabilité) ET par BUILD_ID (unicité / rollback).
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'Dockerfile', '-t', 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:${_GIT_SHA}', '-t', 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:$BUILD_ID', '.']
    dir: 'backend-marketing'

  # Push l'image vers Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:${_GIT_SHA}']
  
  # Déployer sur Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'feedplug-backend-marketing'
      - '--image'
      - 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:${_GIT_SHA}'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      # Label de révision : `gcloud run services describe` révèle alors le commit déployé.
      - '--update-labels'
      - 'git-sha=${_GIT_SHA}'
      # gen2 : environnement d'exécution Linux complet, requis pour Chromium
      # headless (le PDF d'audit). gen1 (gVisor) fait crasher Chrome (SIGTRAP).
      - '--execution-environment'
      - 'gen2'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--cpu-throttling'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '300'
      # B4/B-PROPER — min-instances 1 : à GARDER tant que le mode "in-process"
      # (fallback setTimeout de lib/jobs.js) est le chemin par défaut. Sprint 2 a
      # externalisé les jobs auto (push GMC, auto-optim, sync LIA) et l'ingestion
      # vers Cloud Tasks, MAIS le fallback in-process reste actif tant que les
      # variables CLOUD_TASKS_QUEUE / CLOUD_TASKS_WORKER_BASE_URL ne sont pas
      # peuplées ET que le SDK @google-cloud/tasks n'est pas installé.
      #
      # Pour passer à --min-instances 0 (économie de coûts au repos), PROVISIONNER
      # d'abord (cf. rapport Sprint 2) :
      #   1. gcloud tasks queues create feedplug-jobs --location=europe-west1
      #   2. IAM : donner au SA Cloud Run le rôle roles/cloudtasks.enqueuer ; et si
      #      auth OIDC, autoriser le SA à s'invoquer (roles/run.invoker) + activer
      #      l'ingress. Sinon, auth par SCHEDULER_SECRET (déjà en secret).
      #   3. npm i @google-cloud/tasks (ajouter aux dependencies).
      #   4. Définir les env vars Cloud Tasks ci-dessous, vérifier le log
      #      "[jobs] mode=cloud-tasks" au boot, PUIS basculer min-instances à 0.
      # Tant que ces 4 étapes ne sont pas faites, laisser 1 (sinon jobs perdus).
      - '--min-instances'
      - '1'
      - '--set-env-vars'
      # SHOPIFY_SCOPES n'est pas listé ici : la valeur a des virgules qui
      # cassent la syntaxe gcloud --set-env-vars. Le défaut hardcodé dans
      # server-minimal.js (aligné sur shopify.app.toml) est utilisé.
      - 'NODE_ENV=production,CORS_ORIGIN=https://app.feedplug.com,APP_URL=https://app.feedplug.com,API_URL=https://feedplug-backend-marketing-771607738477.europe-west1.run.app,API_PUBLIC_URL=https://feedplug-backend-marketing-771607738477.europe-west1.run.app,EMAIL_FROM=FeedPlug <noreply@feedplug.com>,MARKETING_REPLY_TO=hello@feedplug.com,RESEND_AUDIENCE_ID=18689648-4319-4fa5-a78b-2b332d4e7429,SHOPIFY_CALLBACK_URL=https://feedplug-backend-marketing-771607738477.europe-west1.run.app/api/v1/connectors/shopify/callback,SHOPIFY_ADMIN_API_VERSION=2026-04,SHOPIFY_BILLING_TRIAL_DAYS=14,SHOPIFY_BILLING_EUR_USD_RATE=1.08,SHOPIFY_PROVISION_TRIAL_DAYS=14,GOOGLE_REDIRECT_URI=https://feedplug-backend-marketing-771607738477.europe-west1.run.app/api/v1/platforms/gmc/callback,AMAZON_REDIRECT_URI=https://feedplug-backend-marketing-771607738477.europe-west1.run.app/api/v1/platforms/amazon/callback,STRIPE_PRICE_STARTER=,STRIPE_PRICE_PROFESSIONAL=price_1T161cQ8WO9CgnnOY6LOv3Va,STRIPE_PRICE_ENTERPRISE=,LIFESTYLE_IMAGE_PROVIDER=vertex,GOOGLE_CLOUD_PROJECT=feedplug-prod,GOOGLE_CLOUD_LOCATION=europe-west1,GOOGLE_CLOUD_LOCATION_IMAGE=global,GOOGLE_GENAI_USE_VERTEXAI=true,GIT_SHA=${_GIT_SHA}'
      # ── Jobs background Cloud Tasks (Sprint 2, B-PROPER) — OPTIONNEL ──────
      # Décommenter et compléter pour activer le mode cloud-tasks (sinon fallback
      # in-process). À ajouter à la fin de la ligne --set-env-vars ci-dessus :
      #   ,CLOUD_TASKS_QUEUE=projects/feedplug-prod/locations/europe-west1/queues/feedplug-jobs
      #   ,CLOUD_TASKS_WORKER_BASE_URL=https://feedplug-backend-marketing-771607738477.europe-west1.run.app
      #   ,JOBS_DEDUP_WINDOW_MS=30000
      # Auth OIDC (recommandé) : ,CLOUD_TASKS_OIDC_SA_EMAIL=<runtime-sa>@feedplug-prod.iam.gserviceaccount.com
      # Ingestion en background (202 + polling IngestionRun) — OFF par défaut :
      #   ,INGESTION_BACKGROUND=1
      # ── Activation Amazon SP-API ──────────────────────────────────────────
      # Pour activer la connexion Amazon Seller Central : créer d'abord les 3
      # secrets ci-dessous dans Secret Manager (voir docs/AMAZON_SP_API_ACTIVATION.md),
      # PUIS ajouter à la fin de la ligne --update-secrets suivante :
      #   ,AMAZON_LWA_CLIENT_ID=amazon-lwa-client-id:latest,AMAZON_LWA_CLIENT_SECRET=amazon-lwa-client-secret:latest,AMAZON_APPLICATION_ID=amazon-application-id:latest
      # ⚠️ Ne pas les ajouter AVANT que les secrets existent : gcloud échoue si
      #    un secret référencé est introuvable, ce qui casserait tout le déploiement.
      # ── Activation app CONNECTEUR Shopify (2e app, unlisted) ──────────────
      # Créer d'abord l'app B en Partners, puis les 2 secrets dans Secret Manager :
      #   gcloud secrets create shopify-connector-api-key    --project=feedplug-prod
      #   gcloud secrets create shopify-connector-api-secret --project=feedplug-prod
      # PUIS ajouter à la fin de --set-env-vars ci-dessus (valeurs sans virgule, OK) :
      #   ,SHOPIFY_CONNECTOR_CALLBACK_URL=https://feedplug-backend-marketing-771607738477.europe-west1.run.app/api/v1/connectors/shopify/callback,SHOPIFY_CONNECTOR_SCOPES=read_products
      # ET à la fin de --update-secrets ci-dessous :
      #   ,SHOPIFY_CONNECTOR_API_KEY=shopify-connector-api-key:latest,SHOPIFY_CONNECTOR_API_SECRET=shopify-connector-api-secret:latest
      # ⚠️ Même règle : ne pas référencer les secrets avant qu'ils existent.
      - '--update-secrets'
      - 'JWT_SECRET=jwt-secret:latest,JWT_REFRESH_SECRET=jwt-refresh-secret:latest,SECRET_ENCRYPTION_KEY=secret-encryption-key:latest,FEEDPLUG_SECRET_ENCRYPTION_KEY=secret-encryption-key:latest,DATABASE_URL=database-url-marketing:latest,GEMINI_API_KEY=feedplug-gemini-api-key:latest,STRIPE_SECRET_KEY=stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=stripe-webhook-secret:latest,FAL_KEY=FAL_KEY:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,SHOPIFY_API_KEY=shopify-api-key:latest,SHOPIFY_API_SECRET=shopify-api-secret:latest,SCHEDULER_SECRET=scheduler-secret:latest,RESEND_API_KEY=resend-api-key:latest,TURNSTILE_SECRET_KEY=turnstile-secret-key:latest'

  # Vérification CORS après déploiement : OPTIONS doit renvoyer 204 (sinon le front ne peut pas appeler l'API).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        API_URL="https://feedplug-backend-marketing-771607738477.europe-west1.run.app"
        echo "Health check..."
        STATUS=$$(curl -s -o /dev/null -w "%{http_code}" "$$API_URL/health" || echo "000")
        [ "$$STATUS" = "200" ] || { echo "Health failed: $$STATUS"; exit 1; }
        echo "OPTIONS (CORS preflight)..."
        OPT_STATUS=$$(curl -s -o /dev/null -w "%{http_code}" -X OPTIONS "$$API_URL/api/v1/performance/dashboard" \
          -H "Origin: https://app.feedplug.com" \
          -H "Access-Control-Request-Method: GET" \
          -H "Access-Control-Request-Headers: Content-Type, Authorization" || echo "000")
        if [ "$$OPT_STATUS" != "204" ]; then
          echo "CORS preflight failed: got $$OPT_STATUS (expected 204). Frontend will not be able to call the API."
          exit 1
        fi
        echo "Smoke test OK (health=200, OPTIONS=204)."

  # Garantir que 100 % du trafic va vers la révision qu'on vient de déployer (évite qu'une ancienne révision sans les derniers secrets/config continue de servir).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'feedplug-backend-marketing'
      - '--region=europe-west1'
      - '--to-latest'
      - '--project=$PROJECT_ID'

images:
  - 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:${_GIT_SHA}'
  - 'gcr.io/$PROJECT_ID/feedplug-backend-marketing:$BUILD_ID'
