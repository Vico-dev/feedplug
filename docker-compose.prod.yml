# ===== DOCKER COMPOSE PRODUCTION POUR FEEDPLUG =====
version: '3.8'

services:
  # ===== APPLICATION FEEDPLUG =====
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: feedplug-app-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Variables GCP
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME}
      PUBSUB_TOPIC: ${PUBSUB_TOPIC}
      # Variables Pennylane
      PENNYLANE_API_URL: ${PENNYLANE_API_URL}
      PENNYLANE_API_KEY: ${PENNYLANE_API_KEY}
      # Variables IA
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    networks:
      - feedplug-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # ===== NGINX REVERSE PROXY =====
  nginx:
    image: nginx:alpine
    container_name: feedplug-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - feedplug-network
    depends_on:
      - app

# ===== RÉSEAU =====
networks:
  feedplug-network:
    driver: bridge
