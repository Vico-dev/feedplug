<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAFA" />
    <title>Hors ligne — Feedplug</title>
    <style>
      :root {
        --paper: #fafafa;
        --surface: #ffffff;
        --ink: #0a0a0a;
        --ink-3: #6f6f6f;
        --accent: #2a6fe8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
        background: var(--surface);
        border: 1px solid rgba(0, 0, 0, 0.06);
        border-radius: 20px;
        padding: 36px 28px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .glyph {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #e8effb;
        color: var(--accent);
        font-size: 26px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 15px; line-height: 1.5; color: var(--ink-3); margin: 0 0 22px; }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: var(--ink);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 999px;
        transition: opacity 0.15s ease;
      }
      button:active { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph">⚡</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de charger cette page sans connexion. Vérifiez votre réseau, puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
